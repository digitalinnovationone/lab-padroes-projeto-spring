spring.application.name=lab-padroes-projeto-spring-gof

server.port=8080

# Configurações do banco de dados H2 (em memória, apenas para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Em produção, use migrações (Flyway/Liquibase) em vez de ddl-auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URL da API externa do ViaCEP (externalizada para permitir override por ambiente)
viacep.url=https://viacep.com.br/ws

# Timeouts do cliente HTTP OpenFeign (ViaCEP)
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Configurações do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html